name: deploy-site

# 사이트 배포는 Cloudflare Pages가 main 변경을 보고 자동으로 한다.
# 이 워크플로는 매일 03:00(한국시간)에 Cloudflare 배포 훅을 불러,
# 코드 변경이 없어도 위성·발사 데이터를 새로 받아 다시 빌드하게 한다.
on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 한국시간 03:00
  workflow_dispatch:       # Actions 탭에서 수동 재배포

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_DEPLOY_HOOK 비밀값이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "Cloudflare deploy hook HTTP ${code}"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Notify manual rebuild
        if: github.event_name == 'workflow_dispatch'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          text=$(printf '🌐 사이트 재배포 요청됨\n1~2분 뒤 확인: %s' "$SITE_URL")
          curl -sS -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}"

      - name: Notify failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text=$(printf '⚠️ 매일 데이터 갱신 배포 실패\n%s' "$RUN_URL")
          curl -sS -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}"
