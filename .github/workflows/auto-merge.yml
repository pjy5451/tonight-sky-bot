name: auto-merge

# QA 코멘트를 보고 자동으로 처리한다.
#  - "[QA] 통과": CI가 성공하면 PR을 스쿼시 머지하고 브랜치를 지운다. 사이트는 main 변경을 보고 Cloudflare Pages가 배포한다.
#  - "[QA] 반려", CI 실패, 머지 충돌: qa-feedback 브랜치에 수정 요청을 기록한다.
#    같은 작업이 3번 반려되면 blocked로 표시하고 텔레그램으로 사람을 부른다.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  handle:
    # PR에 달린, 봇 또는 저장소 주인의 코멘트만 처리한다 (공개 저장소 보호).
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.user.type == 'Bot' || github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review' &&
        (github.event.review.user.type == 'Bot' || github.event.review.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
      BODY: ${{ github.event.comment.body || github.event.review.body }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Read verdict
        id: v
        run: |
          first=$(printf '%s\n' "$BODY" | sed '/^[[:space:]]*$/d' | head -n 1 | sed -E 's/^[[:space:]>*#`_-]*//')
          case "$first" in
            "[QA] 통과"*) echo "verdict=pass" >> "$GITHUB_OUTPUT" ;;
            "[QA] 반려"*) echo "verdict=fail" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=none" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Load PR info
        if: steps.v.outputs.verdict != 'none'
        id: pr
        run: |
          info=$(gh pr view "$PR" --repo "$REPO" --json state,isCrossRepository,headRefName,headRefOid,title)
          state=$(echo "$info" | jq -r .state)
          cross=$(echo "$info" | jq -r .isCrossRepository)
          branch=$(echo "$info" | jq -r .headRefName)
          sha=$(echo "$info" | jq -r .headRefOid)
          title=$(echo "$info" | jq -r .title)
          ok=false
          if [ "$state" = "OPEN" ] && [ "$cross" = "false" ] && [[ "$branch" =~ ^(task-[0-9]{2}-|plan-) ]]; then ok=true; fi
          if [[ "$title" =~ \[task-([0-9]{2})\] ]]; then key="task-${BASH_REMATCH[1]}"; else key="$branch"; fi
          {
            echo "ok=$ok"; echo "branch=$branch"; echo "sha=$sha"; echo "key=$key"
            echo "title<<PR_TITLE_END"; echo "$title"; echo "PR_TITLE_END"
          } >> "$GITHUB_OUTPUT"
          echo "state=$state cross=$cross branch=$branch key=$key ok=$ok"

      - name: Wait for CI and merge
        if: steps.v.outputs.verdict == 'pass' && steps.pr.outputs.ok == 'true'
        id: merge
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          result=""
          for i in $(seq 1 60); do
            run=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" -L 1 --json status,conclusion,url)
            status=$(echo "$run" | jq -r '.[0].status // "none"')
            concl=$(echo "$run" | jq -r '.[0].conclusion // ""')
            if [ "$status" = "completed" ]; then result="$concl"; url=$(echo "$run" | jq -r '.[0].url'); break; fi
            sleep 30
          done
          if [ "$result" != "success" ]; then
            echo "outcome=ci_failed" >> "$GITHUB_OUTPUT"
            { echo "note<<NOTE_END"; echo "CI가 성공하지 않아 자동 머지하지 못함 (결과: ${result:-시간 초과}) ${url:-}"; echo "NOTE_END"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh pr merge "$PR" --repo "$REPO" --squash --delete-branch; then
            echo "outcome=merged" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=merge_failed" >> "$GITHUB_OUTPUT"
            { echo "note<<NOTE_END"; echo "main과 충돌 등으로 머지 실패. 이 브랜치에 main을 머지해 충돌을 해결하고 테스트·빌드를 다시 통과시킬 것."; echo "NOTE_END"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Notify merged
        if: steps.merge.outputs.outcome == 'merged'
        env:
          TITLE: ${{ steps.pr.outputs.title }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          text=$(printf '🤖 자동 머지됨 #%s\n%s\nCloudflare가 1~2분 안에 사이트를 갱신합니다.\n%s' "$PR" "$TITLE" "$SITE_URL")
          curl -sS -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}"

      - name: Checkout feedback branch
        if: >-
          steps.pr.outputs.ok == 'true' &&
          (steps.v.outputs.verdict == 'fail' || steps.merge.outputs.outcome == 'ci_failed' || steps.merge.outputs.outcome == 'merge_failed')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record feedback
        if: >-
          steps.pr.outputs.ok == 'true' &&
          (steps.v.outputs.verdict == 'fail' || steps.merge.outputs.outcome == 'ci_failed' || steps.merge.outputs.outcome == 'merge_failed')
        env:
          KEY: ${{ steps.pr.outputs.key }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          NOTE: ${{ steps.merge.outputs.note }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin qa-feedback >/dev/null 2>&1; then
            git fetch origin qa-feedback
            git checkout -B qa-feedback origin/qa-feedback
          else
            git checkout --orphan qa-feedback
            git rm -rf . -q || true
            printf '# QA 피드백 기록\n\n자동화가 관리하는 브랜치. 사람이 고치지 않아도 된다.\n' > README.md
          fi
          file="${KEY}.md"
          prev=0
          if [ -f "$file" ]; then prev=$(grep -m1 '^attempts:' "$file" | awk '{print $2}'); prev=${prev:-0}; fi
          attempts=$((prev + 1))
          if [ "$attempts" -ge 3 ]; then status=blocked; else status=fix-needed; fi
          if [ -n "$NOTE" ]; then feedback="$NOTE"; else feedback="$BODY"; fi
          {
            echo "status: $status"
            echo "attempts: $attempts"
            echo "pr: $PR"
            echo "branch: $BRANCH"
            echo "title: $TITLE"
            echo ""
            echo "## 최근 피드백"
            echo ""
            printf '%s\n' "$feedback"
          } > "$file"
          git add -A
          git commit -m "qa-feedback: ${KEY} ${status} (${attempts})"
          git push origin qa-feedback
          echo "STATUS=$status" >> "$GITHUB_ENV"
          echo "ATTEMPTS=$attempts" >> "$GITHUB_ENV"

      - name: Notify blocked or failure
        if: >-
          steps.pr.outputs.ok == 'true' &&
          (env.STATUS == 'blocked' || steps.merge.outputs.outcome == 'ci_failed' || steps.merge.outputs.outcome == 'merge_failed')
        env:
          TITLE: ${{ steps.pr.outputs.title }}
          OUTCOME: ${{ steps.merge.outputs.outcome }}
        run: |
          if [ "$STATUS" = "blocked" ]; then
            text=$(printf '🛑 사람 확인 필요 — PR #%s\n%s\n3번 반려되어 이 작업은 보류됐습니다. 다른 작업은 계속 진행됩니다.\nhttps://github.com/%s/pull/%s' "$PR" "$TITLE" "$REPO" "$PR")
          else
            text=$(printf '⚠️ 자동 머지 보류 — PR #%s (%s)\n%s\n다음 개발 실행 때 자동으로 고칩니다.' "$PR" "$OUTCOME" "$TITLE")
          fi
          curl -sS -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}"
